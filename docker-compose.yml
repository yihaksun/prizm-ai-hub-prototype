name: prototype

services:
  # ── AI Hub: Asset Key+Version -> S3 경로 Resolve ────────────
  # PRIZM 자체 구성요소. Postgres/MinIO/MLflow/Airflow는 prizm-backend/infra/
  # docker-compose.opensource.yml이 책임진다 - 이 파일은 그 스택 위에 얹는
  # "나머지"(AI Hub, SDK, 런타임 베이스 이미지)만 담는다. 두 compose 파일 모두
  # `name: prototype`으로 프로젝트명을 고정해서 같은 prototype_default 네트워크를
  # 공유한다. MinIO에 직접 접근하지 않는(JSON 카탈로그만 다루는) 서비스라
  # MinIO가 뜨는 순서를 기다릴 필요도 없다.
  ai-hub:
    build:
      context: ./ai-hub
    ports:
      - "8000:8000"
    volumes:
      - ai_hub_data:/data

  # ── PRIZM 편집 세션 런타임 베이스 이미지 (compose가 띄우진 않는다 - build 전용) ──
  # 이 서비스 자체는 `up`으로 절대 뜨지 않는다(profiles로 기본에서 제외). 목적은 오직
  # `docker compose --profile build build runtime-base` 한 줄로 prizm/runtime-base:v1을
  # 재현 가능하게 빌드하는 것 - env-builds/*/Dockerfile과 편집 세션 컨테이너가 이 이미지를
  # 베이스로 쓰고, prizm-backend/infra의 MLOPS_BASE_IMAGE 환경변수도 이 태그(또는
  # Docker Hub의 yihaksun/prizm-runtime-base:v1)를 가리킨다.
  runtime-base:
    build:
      context: .
      dockerfile: runtime/base/Dockerfile
    image: prizm/runtime-base:v1
    profiles: ["build"]

  # ── 초기 자산 시딩 (1회성. `docker compose --profile seed run --rm seed`) ──
  # runtime-base 이미지를 그대로 재사용한다 (sklearn/ultralytics/SDK가 이미 다 있음) -
  # 먼저 `docker compose --profile build build runtime-base`로 빌드하거나
  # Docker Hub(yihaksun/prizm-runtime-base:v1)에서 pull 해둬야 한다.
  # 아래 MLOPS_S3_* 값은 로컬 MinIO 기준 기본값이다 - 회사 S3를 쓴다면 이 네 값을
  # 실제 엔드포인트/자격증명으로 바꾸거나 `docker compose run -e MLOPS_S3_ENDPOINT=... seed`
  # 처럼 오버라이드한다.
  seed:
    image: prizm/runtime-base:v1
    environment:
      MLOPS_AI_HUB_URL: http://ai-hub:8000
      MLOPS_S3_ENDPOINT: http://minio:9000
      MLOPS_S3_ACCESS_KEY: minioadmin
      MLOPS_S3_SECRET_KEY: minioadmin
      MLOPS_BUCKET: mlops-assets
    volumes:
      - ./notebooks:/opt/seed/notebooks:ro
      - ./seed:/opt/seed/scripts:ro
    working_dir: /opt/seed/scripts
    depends_on:
      - ai-hub
    entrypoint: ["python", "seed_assets.py"]
    profiles: ["seed"]

volumes:
  ai_hub_data:
